name: Site audits

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          install-chromedriver: true
      - run: npm ci
      - run: npm run build
      - run: npm i -g serve @lhci/cli @axe-core/cli html-validate linkinator
      - run: |
          nohup serve -s dist -l 4173 >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break
            sleep 0.5
          done
      - run: lhci collect --url=http://localhost:4173 --numberOfRuns=3 --config=lighthouserc.json
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: lhci assert --config=lighthouserc.json
      - run: axe http://127.0.0.1:4173 --chrome-path "${{ steps.setup-chrome.outputs.chrome-path }}" --chromedriver-path "${{ steps.setup-chrome.outputs.chromedriver-path }}" --exit --stdout
      - run: html-validate dist/index.html
      - run: linkinator http://localhost:4173 --config linkinator.config.json
